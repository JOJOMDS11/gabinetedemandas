<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda do Gabinete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1a73e8;
    --blue-dark:#1967d2;
    --blue-tint:#e8f0fe;
    --grey-bg:#f1f3f4;
    --grey-border:#dadce0;
    --text-main:#3c4043;
    --text-secondary:#5f6368;
    --green:#188038;
    --green-dark:#137333;
    --radius:8px;
    --shadow-1: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-2: 0 1px 3px 0 rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Roboto','Google Sans',Arial,sans-serif;
    background:#fff;
    color:var(--text-main);
    scroll-behavior: smooth;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:20px;
    padding:8px 16px;
    border-bottom:1px solid var(--grey-border);
    background:#fff;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-icon{ width:34px;height:34px;flex-shrink:0; }
  .brand-text{ font-family:'Google Sans',Roboto,sans-serif; font-size:20px; color:var(--text-secondary); letter-spacing:.1px; }
  .brand-text b{ color:var(--text-main); font-weight:500; }
  .topbar-spacer{ flex:1; }
  .today-pill{ font-size:13px; color:var(--text-secondary); padding:6px 12px; border:1px solid var(--grey-border); border-radius:20px; }

  /* ---------- Layout ---------- */
  .layout{ display:flex; max-width:1180px; margin:0 auto; padding:28px 20px 60px; gap:28px; align-items:flex-start; }
  
  /* ---------- Sidebar Nav ---------- */
  .sidebar{ width:270px; flex-shrink:0; position: sticky; top: 80px; }
  .create-btn{
    display:flex; align-items:center; gap:12px; background:#fff; border:none; box-shadow:var(--shadow-1);
    border-radius:24px; padding:10px 22px 10px 14px; font-family:'Google Sans',Roboto,sans-serif;
    font-size:14px; font-weight:500; color:var(--text-main); cursor:pointer; margin-bottom:12px; transition:box-shadow .15s; width: 100%;
  }
  .create-btn:hover{ box-shadow:var(--shadow-2); }
  .create-plus{
    width:36px;height:36px;border-radius:50%; background:var(--blue); display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:22px;font-weight:400;flex-shrink:0;
  }
  .nav-side-btn {
    display:flex; align-items:center; gap:12px; background:var(--grey-bg); border:1px solid var(--grey-border);
    border-radius:24px; padding:10px 22px; font-family:'Google Sans',Roboto,sans-serif;
    font-size:13px; font-weight:500; color:var(--text-secondary); cursor:pointer; margin-bottom:12px; transition:background .15s; width: 100%;
  }
  .nav-side-btn:hover { background: var(--blue-tint); color: var(--blue-dark); border-color: var(--blue-tint); }

  .side-card{ border:1px solid var(--grey-border); border-radius:var(--radius); padding:16px; margin-bottom:16px; margin-top: 24px;}
  .side-card h3{
    font-family:'Google Sans',Roboto,sans-serif; font-size:13px; font-weight:500; color:var(--text-main);
    margin:0 0 12px; text-transform:uppercase; letter-spacing:.3px; display: flex; justify-content: space-between; align-items: center;
  }
  .side-card p{ font-size:13px; color:var(--text-secondary); line-height:1.5; margin:0; }

  /* ---------- Main column ---------- */
  .main-col{ flex:1; min-width:0; }
  .panel{ border:1px solid var(--grey-border); border-radius:12px; box-shadow:var(--shadow-1); margin-bottom:24px; scroll-margin-top: 80px;}
  .panel-header{ display:flex; align-items:center; gap:10px; padding:18px 24px; border-bottom:1px solid var(--grey-border); border-radius:12px 12px 0 0; }
  .panel-header .dot{ width:12px;height:12px;border-radius:50%;flex-shrink:0; }
  .dot-blue{ background:var(--blue); } .dot-green{ background:var(--green); }
  .panel-header h2{ font-family:'Google Sans',Roboto,sans-serif; font-size:16px; font-weight:500; margin:0; color:var(--text-main); }
  .panel-body{ padding:24px; border-radius:0 0 12px 12px; }

  label{ display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px; }
  .field{ margin-bottom:18px; }
  input[type="text"], input[type="date"], input[type="time"], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--grey-border); border-radius:6px; font-size:14px;
    font-family:'Roboto',Arial,sans-serif; color:var(--text-main); background:#fff; transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  textarea{ resize:vertical; line-height:1.5; }
  .row-2{ display:flex; gap:16px; }
  .row-2 .field{ flex:1; }
  .row-inline{ display:flex; gap:12px; align-items:flex-end; margin-bottom:18px; }
  .row-inline .field{ flex:1; margin-bottom:0; }

  button.action{ border:none; border-radius:20px; padding:10px 24px; font-family:'Google Sans',Roboto,sans-serif; font-size:14px; font-weight:500; cursor:pointer; color:#fff; transition:background .15s, box-shadow .15s; white-space:nowrap; }
  .btn-blue{ background:var(--blue); } .btn-blue:hover{ background:var(--blue-dark); box-shadow:var(--shadow-1); }
  .btn-green{ background:var(--green); } .btn-green:hover{ background:var(--green-dark); box-shadow:var(--shadow-1); }
  .btn-block{ width:100%; padding:11px 24px; }
  .btn-ghost{ background:none; color:var(--blue); border:1px solid var(--grey-border); }
  .btn-ghost:hover{ background:var(--blue-tint); }

  #mensagemStatus{ display:none; font-size:13px; font-weight:500; padding:10px 14px; border-radius:6px; margin-bottom:16px; }
  .status-loading{ background:#fef7e0; color:#7a5900; } .status-ok{ background:#e6f4ea; color:var(--green-dark); }
  .actions-right{ display:flex; justify-content:flex-end; gap:10px; }

  /* ---------- Autocomplete de local ---------- */
  .field-relative{ position:relative; }
  .suggestions-box{ display:none; position:absolute; top:calc(100% - 14px); left:0; right:0; background:#fff; border:1px solid var(--grey-border); border-radius:8px; box-shadow:var(--shadow-2); z-index:20; max-height:220px; overflow-y:auto; }
  .suggestion-item{ padding:10px 14px; font-size:13px; color:var(--text-main); cursor:pointer; border-bottom:1px solid #f1f3f4; }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover{ background:var(--blue-tint); }

  .btn-whatsapp{ background:#25D366; } .btn-whatsapp:hover{ background:#1ebd5a; }

  /* ---------- Campo de data com atalho "Hoje" ---------- */
  .date-com-hoje{ display:flex; gap:8px; align-items:stretch; } .date-com-hoje input{ flex:1; }
  .btn-hoje{ flex-shrink:0; background:var(--grey-bg); border:1px solid var(--grey-border); border-radius:6px; padding:0 14px; font-size:13px; font-family:'Google Sans',Roboto,sans-serif; font-weight:500; color:var(--blue); cursor:pointer; transition:background .15s; }
  .btn-hoje:hover{ background:var(--blue-tint); }

  /* ---------- E-mails frequentes (chips) ---------- */
  .chips-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip{ display:flex; align-items:center; gap:6px; background:var(--blue-tint); color:var(--blue-dark); border-radius:16px; padding:5px 8px 5px 12px; font-size:12.5px; font-family:'Roboto',Arial,sans-serif; }
  .chip button{ background:none; border:none; color:var(--blue-dark); cursor:pointer; font-size:14px; line-height:1; padding:2px 4px; border-radius:50%; }
  .chip button:hover{ background:rgba(26,115,232,.18); }
  .chip .chip-nome{ cursor:pointer; } .chip .chip-nome:hover{ text-decoration:underline; }
  .empty-hint{ font-size:12.5px; color:var(--text-secondary); margin-top:8px; display: block;}

  /* ---------- Engrenagem / Botões Limpar ---------- */
  .label-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .label-row label{ margin-bottom:0; }
  .gear-btn{ background:none; border:none; cursor:pointer; font-size:12px; line-height:1; padding:4px 8px; border-radius:4px; flex-shrink:0; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 4px; transition: 0.2s;}
  .gear-btn:hover{ background:var(--grey-bg); color: var(--blue); }
  
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.aberto{ display:flex; }
  .modal-box{ background:#fff; border-radius:12px; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; padding:20px; box-shadow:var(--shadow-2); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ font-family:'Google Sans',Roboto,sans-serif; font-size:16px; margin:0; color:var(--text-main); }
  .modal-head button{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-secondary); }
  .modal-add-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .lista-item-simples{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border:1px solid var(--grey-border); border-radius:6px; margin-bottom:6px; font-size:13px; }
  .lista-item-simples span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- Anotações (sidebar) ---------- */
  .nota-mini{ display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--grey-border); }
  .nota-mini:last-child{ border-bottom:none; }
  .nota-mini input[type="checkbox"]{ margin-top:3px; flex-shrink:0; }
  .nota-mini-texto{ flex:1; min-width:0; }
  .nota-mini-titulo{ font-size:13px; font-weight:500; color:var(--text-main); word-break:break-word; }
  .nota-mini.feita .nota-mini-titulo{ text-decoration:line-through; color:var(--text-secondary); }
  .nota-mini-desc{ font-size:12px; color:var(--text-secondary); margin-top:2px; word-break:break-word; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  
  .badge-prioridade { font-size: 10px; padding: 2px 6px; border-radius: 10px; border: 1px solid #ccc; font-weight: bold; margin-bottom: 3px; display: inline-block;}
  .prio-Normal { background: #fef7e0; color: #b08d00; border-color: #fef7e0; }
  .prio-Alta { background: #fce8e6; color: #d93025; border-color: #fce8e6; }
  .prio-Crítica { background: #d93025; color: white; border-color: #d93025; }
  .prio-Baixa { background: #f1f3f4; color: #5f6368; border-color: #f1f3f4; }

  .acoes-nota-rapida { display: flex; gap: 4px; flex-shrink: 0; }
  .nota-btn-icon{ background:none; border:none; cursor:pointer; font-size:13px; padding: 4px; border-radius: 4px; transition: 0.2s;}
  .nota-btn-icon:hover{ background: var(--grey-bg); }
  .btn-del-icon { color:#a1a1a1; } .btn-del-icon:hover { color:#d93025; background: #fce8e6; }
  .btn-lupa-icon { color: var(--blue); } .btn-lupa-icon:hover { background: var(--blue-tint); }

  @media (max-width:820px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; position: static;}
    .row-2{ flex-direction:column; gap:0; }
    .row-inline{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="4" width="20" height="18" rx="3" fill="#fff" stroke="#5f6368" stroke-width="1.4"/>
      <rect x="2" y="4" width="20" height="5" rx="2" fill="#1a73e8"/>
      <rect x="6" y="2" width="1.6" height="5" rx="0.8" fill="#5f6368"/>
      <rect x="16.4" y="2" width="1.6" height="5" rx="0.8" fill="#5f6368"/>
      <text x="12" y="18" text-anchor="middle" font-family="Google Sans, Roboto, sans-serif" font-size="9" font-weight="700" fill="#1a73e8">05</text>
    </svg>
    <span class="brand-text">Agenda <b>do Gabinete</b></span>
  </div>
  <div class="topbar-spacer"></div>
  <span class="today-pill" id="dataHoje">—</span>
</div>

<div class="layout">

  <!-- SIDEBAR COM ATALHOS -->
  <aside class="sidebar">
    <button class="create-btn" onclick="window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('novoTitulo').focus()">
      <span class="create-plus">+</span> Criar evento
    </button>
    <button class="nav-side-btn" onclick="document.getElementById('secaoZap').scrollIntoView()">
      📱 Gerar Agenda Zap
    </button>
    <button class="nav-side-btn" onclick="document.getElementById('secaoAnotacoes').scrollIntoView()">
      📝 Anotações Rápidas
    </button>

    <div class="side-card">
      <h3>📝 SUAS ANOTAÇÕES </h3>
      <div id="listaAnotacoesSidebar"><span class="empty-hint">Carregando...</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-col">

    <!-- CRIAR EVENTO -->
    <section class="panel" id="secaoCriar">
      <div class="panel-header">
        <span class="dot dot-blue"></span>
        <h2>Novo evento</h2>
      </div>
      <div class="panel-body">

        <div id="mensagemStatus"></div>

        <div class="field">
          <label>Título</label>
          <input type="text" id="novoTitulo" placeholder="Ex: Sessão Solene APAE">
        </div>

        <div class="row-2">
          <div class="field">
            <label>Data</label>
            <div class="date-com-hoje">
              <input type="date" id="novaData">
              <button type="button" class="btn-hoje" onclick="irParaHoje('novaData')">Hoje</button>
            </div>
          </div>
          <div class="field">
            <label>Horário</label>
            <input type="time" id="novaHora">
          </div>
        </div>

        <div class="field field-relative">
          <div class="label-row">
            <label style="margin:0;">Local / Endereço</label>
            <button type="button" class="gear-btn" onclick="document.getElementById('novoLocal').value = '';" title="Apagar local">🧹 Limpar</button>
          </div>
          <input type="text" id="novoLocal" placeholder="Digite rua e número, ex: Av. 25 de Julho, 363..." autocomplete="off">
          <div id="sugestoesLocal" class="suggestions-box"></div>
        </div>

        <div class="field">
          <div class="label-row">
            <label style="margin:0;">Descrição</label>
            <button type="button" class="gear-btn" onclick="document.getElementById('novaDescricao').value = '';" title="Apagar descrição">🧹 Limpar</button>
          </div>
          <textarea id="novaDescricao" rows="3" placeholder="Detalhes do evento (opcional)"></textarea>
        </div>

        <div class="field">
          <div class="label-row">
            <label style="margin:0;">Convidados / Gestores</label>
            <button type="button" class="gear-btn" onclick="abrirModalEmails()" title="Gerenciar e-mails salvos">⚙️ Configurar</button>
          </div>
          <input type="text" id="novosConvidados" placeholder="e-mails separados por vírgula">
          <div class="chips-row" id="chipsEmails"></div>
        </div>

        <div class="row-2">
          <div class="field">
            <label>Lembrete</label>
            <select id="novoLembrete">
              <option value="30" selected>30 minutos antes (Padrão)</option>
              <option value="10">10 minutos antes</option>
              <option value="60">1 hora antes</option>
              <option value="1440">1 dia antes</option>
              <option value="">Sem lembrete</option>
            </select>
          </div>
          <div class="field"></div>
        </div>

        <div class="actions-right">
          <button class="action btn-blue" onclick="criarEventoNoGoogle()">Salvar na agenda</button>
        </div>
      </div>
    </section>

    <!-- WHATSAPP -->
    <section class="panel" id="secaoZap">
      <div class="panel-header">
        <span class="dot dot-green"></span>
        <h2>Gerar agenda para WhatsApp</h2>
      </div>
      <div class="panel-body">

        <div class="row-inline">
          <div class="field">
            <label>Data para copiar</label>
            <div class="date-com-hoje">
              <input type="date" id="dataBusca">
              <button type="button" class="btn-hoje" onclick="irParaHoje('dataBusca')">Hoje</button>
            </div>
          </div>
          <button class="action btn-ghost" onclick="buscarAgenda()">Puxar eventos</button>
        </div>

        <div class="field">
          <div class="label-row">
            <label style="margin:0;">Prévia da mensagem</label>
            <button type="button" class="gear-btn" onclick="document.getElementById('resultadoAgenda').value = '';" title="Limpar caixa">🧹 Limpar</button>
          </div>
          <textarea id="resultadoAgenda" rows="8" placeholder="O texto da agenda formatada para o Zap aparecerá aqui..."></textarea>
        </div>

        <div class="row-2">
          <button class="action btn-green" onclick="copiarTexto()">Copiar texto 📋</button>
          <button class="action btn-whatsapp" onclick="enviarWhatsApp()">Enviar no WhatsApp 📱</button>
        </div>
      </div>
    </section>

    <!-- ANOTAÇÕES -->
    <section class="panel" id="secaoAnotacoes">
      <div class="panel-header">
        <span class="dot dot-blue"></span>
        <h2>Anotações rápidas</h2>
      </div>
      <div class="panel-body">

        <div class="row-2">
          <div class="field" style="flex: 2;">
            <label>Título</label>
            <input type="text" id="novaNotaTitulo" placeholder="Ex: Ligar para a secretaria">
          </div>
          <div class="field" style="flex: 1;">
            <label>Prioridade</label>
            <select id="novaNotaPrioridade">
              <option value="Normal">🟡 Normal</option>
              <option value="Alta">🟠 Alta</option>
              <option value="Crítica">🔴 Crítica</option>
              <option value="Baixa">⚪ Baixa</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label style="margin:0;">Descrição</label>
            <button type="button" class="gear-btn" onclick="document.getElementById('novaNotaDescricao').value = '';">🧹 Limpar</button>
          </div>
          <textarea id="novaNotaDescricao" rows="3" placeholder="Escreva os detalhes aqui..."></textarea>
        </div>

        <div class="actions-right">
          <button class="action btn-blue" onclick="salvarAnotacao()">Salvar anotação</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- MODAL: GERENCIAR E-MAILS FREQUENTES -->
<div id="modalEmails" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚙️ E-mails salvos</h3>
      <button type="button" onclick="fecharModalEmails()">✕</button>
    </div>
    <div class="modal-add-row">
      <input type="text" id="modalEmailNome" placeholder="Apelido (ex: Secretaria de Obras)">
      <input type="text" id="modalEmailEndereco" placeholder="email@exemplo.com">
      <button type="button" class="action btn-blue btn-block" onclick="adicionarEmailModal()">➕ Adicionar</button>
    </div>
    <div id="listaEmailsModal"></div>
  </div>
</div>

<!-- MODAL: DETALHE DA ANOTAÇÃO ÚNICA -->
<div id="modalDetalheAnotacao" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3>🔍 Detalhes da Anotação</h3>
      <button type="button" onclick="fecharModalDetalheAnotacao()">✕</button>
    </div>
    <div id="conteudoDetalheAnotacao" style="font-size: 14px; color: var(--text-main); line-height: 1.6;">
      <!-- Preenchido via JS -->
    </div>
  </div>
</div>

<script>
  // ==========================================
  // LINK DO SCRIPT (Google Apps Script)
  // ==========================================
  const URL_DO_SCRIPT = 'COLOQUE_SEU_LINK_AQUI';

  // ==========================================
  // SUPABASE (e-mails frequentes + anotações)
  // ==========================================
  let db;
  let listaAnotacoesGlobal = []; // Guarda as anotações na memória para a Lupa

  async function inicializarSupabase() {
    try {
      const res = await fetch('https://ypuniizmkadgoxhuzgxu.supabase.co/functions/v1/config');
      const config = await res.json();
      db = supabase.createClient(config.supabaseUrl, config.supabaseKey);
      await carregarEmailsFrequentes();
      await carregarAnotacoes();
    } catch (erro) {
      console.error('Erro ao conectar no Supabase:', erro);
    }
  }
  inicializarSupabase();

  // --- E-MAILS FREQUENTES ---
  async function carregarEmailsFrequentes() {
    try {
      const { data, error } = await db.from('emails_frequentes').select('id, nome, email').order('nome');
      if (error) throw error;
      renderChipsEmails(data || []);
    } catch (erro) {
      console.error('Erro ao carregar e-mails frequentes:', erro);
    }
  }

  function renderChipsEmails(lista) {
    const container = document.getElementById('chipsEmails');
    if (!lista || lista.length === 0) {
      container.innerHTML = '<span class="empty-hint">Nenhum e-mail salvo ainda.</span>';
      return;
    }
    container.innerHTML = lista.map(item => `
      <span class="chip">
        <span class="chip-nome" onclick="usarEmailFrequente('${item.email.replace(/'/g, "\\'")}')" title="${item.email}">${item.nome || item.email}</span>
        <button type="button" onclick="excluirEmailFrequente(${item.id})" title="Remover">✕</button>
      </span>
    `).join('');
  }

  function usarEmailFrequente(email) {
    const campo = document.getElementById('novosConvidados');
    const atuais = campo.value.split(',').map(e => e.trim()).filter(Boolean);
    if (!atuais.includes(email)) atuais.push(email);
    campo.value = atuais.join(', ');
  }

  // --- ANOTAÇÕES ---
  async function carregarAnotacoes() {
    try {
      const { data, error } = await db.from('anotacoes').select('id, titulo, descricao, concluida, criado_em, prioridade').order('concluida', { ascending: true }).order('criado_em', { ascending: false });
      if (error) throw error;
      listaAnotacoesGlobal = data || [];
      renderAnotacoes(listaAnotacoesGlobal);
    } catch (erro) {
      console.error('Erro ao carregar anotações:', erro);
    }
  }

  function escaparHtml(texto) {
    const div = document.createElement('div'); div.innerText = texto || ''; return div.innerHTML;
  }

  function renderAnotacoes(lista) {
    const container = document.getElementById('listaAnotacoesSidebar');
    if (!lista || lista.length === 0) {
      container.innerHTML = '<span class="empty-hint">Nenhuma anotação salva ainda.</span>';
      return;
    }
    container.innerHTML = lista.map(nota => {
      const prioClass = `prio-${nota.prioridade || 'Normal'}`;
      return `
      <div class="nota-mini${nota.concluida ? ' feita' : ''}">
        <input type="checkbox" ${nota.concluida ? 'checked' : ''} onchange="alternarAnotacaoConcluida(${nota.id}, this.checked)" title="Marcar como feita">
        <div class="nota-mini-texto">
          <span class="badge-prioridade ${prioClass}">${nota.prioridade || 'Normal'}</span>
          <div class="nota-mini-titulo">${escaparHtml(nota.titulo)}</div>
          ${nota.descricao ? `<div class="nota-mini-desc">${escaparHtml(nota.descricao)}</div>` : ''}
        </div>
        <div class="acoes-nota-rapida">
          <button type="button" class="nota-btn-icon btn-lupa-icon" onclick="verDetalheAnotacao(${nota.id})" title="Ver Anotação">🔍</button>
          <button type="button" class="nota-btn-icon btn-del-icon" onclick="excluirAnotacao(${nota.id})" title="Excluir">🗑️</button>
        </div>
      </div>
    `}).join('');
  }

  // Função para abrir Lupa Específica
  function verDetalheAnotacao(id) {
    const nota = listaAnotacoesGlobal.find(n => n.id === id);
    if (!nota) return;
    
    const prioClass = `prio-${nota.prioridade || 'Normal'}`;
    const dataCriacao = new Date(nota.criado_em).toLocaleDateString('pt-BR');
    
    document.getElementById('conteudoDetalheAnotacao').innerHTML = `
      <div style="margin-bottom: 15px;">
        <span class="badge-prioridade ${prioClass}" style="font-size: 12px;">Prioridade: ${nota.prioridade || 'Normal'}</span>
        <span style="float: right; font-size: 11px; color: var(--text-secondary);">Criado em: ${dataCriacao}</span>
      </div>
      <h4 style="margin-top: 0; font-size: 18px; color: var(--blue); margin-bottom: 10px;">${escaparHtml(nota.titulo)}</h4>
      <div style="background: var(--grey-bg); padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 15px;">${escaparHtml(nota.descricao) || '<i>Sem descrição detalhada.</i>'}</div>
    `;
    
    document.getElementById('modalDetalheAnotacao').classList.add('aberto');
  }

  function fecharModalDetalheAnotacao() {
    document.getElementById('modalDetalheAnotacao').classList.remove('aberto');
  }

  async function alternarAnotacaoConcluida(id, concluida) {
    try {
      const { error } = await db.from('anotacoes').update({ concluida }).eq('id', id);
      if (error) throw error;
      await carregarAnotacoes();
    } catch (erro) { alert('Erro ao atualizar anotação: ' + erro.message); }
  }

  async function salvarAnotacao() {
    const tituloCampo = document.getElementById('novaNotaTitulo');
    const descricaoCampo = document.getElementById('novaNotaDescricao');
    const prioridadeCampo = document.getElementById('novaNotaPrioridade');
    
    const titulo = tituloCampo.value.trim();
    const descricao = descricaoCampo.value.trim();
    const prioridade = prioridadeCampo.value;

    if (!titulo) return alert('Digite um título para a anotação.');

    try {
      const { error } = await db.from('anotacoes').insert([{ titulo, descricao, prioridade }]);
      if (error) throw error;
      tituloCampo.value = ''; descricaoCampo.value = ''; prioridadeCampo.value = 'Normal';
      await carregarAnotacoes();
    } catch (erro) { alert('Erro ao salvar anotação: ' + erro.message); }
  }

  async function excluirAnotacao(id) {
    if (!confirm('Excluir esta anotação?')) return;
    try {
      const { error } = await db.from('anotacoes').delete().eq('id', id);
      if (error) throw error;
      await carregarAnotacoes();
    } catch (erro) { alert('Erro ao excluir anotação: ' + erro.message); }
  }

  // Mostra a data de hoje no topo
  (function mostrarDataHoje() {

  function dataDeHojeISO() {

    const dia = String(hoje.getDate()).padStart(2, '0');

    document.getElementById(idCampo).value = dataDeHojeISO();
  }

  // --- FUNÇÃO PARA CRIAR EVENTO ---
  async function criarEventoNoGoogle() {
    const titulo = document.getElementById('novoTitulo').value;
    const data = document.getElementById('novaData').value;
    const hora = document.getElementById('novaHora').value;
    const local = document.getElementById('novoLocal').value;
    const descricao = document.getElementById('novaDescricao').value;
    const convidados = document.getElementById('novosConvidados').value;
    const lembrete = document.getElementById('novoLembrete').value;
    const status = document.getElementById('mensagemStatus');

    if (!titulo || !data || !hora) return alert("Por favor, preencha o título, a data e a hora!");

    status.style.display = 'block';
    status.className = 'status-loading';
    status.innerText = 'Salvando no Google Agenda... ⏳';

    try {
      const urlCompleta = `${URL_DO_SCRIPT}?acao=criar&titulo=${encodeURIComponent(titulo)}&data=${data}&hora=${hora}&local=${encodeURIComponent(local)}&descricao=${encodeURIComponent(descricao)}&convidados=${encodeURIComponent(convidados)}&lembrete=${encodeURIComponent(lembrete)}`;
      const resposta = await fetch(urlCompleta);
      const resultado = await resposta.json();

      if (resultado.status === 'sucesso') {
        status.className = 'status-ok';
        status.innerText = '✅ Evento salvo com sucesso!';

        document.getElementById('novoTitulo').value = ''; document.getElementById('novaHora').value = '';
        document.getElementById('novoLocal').value = ''; document.getElementById('novaDescricao').value = '';
        document.getElementById('novosConvidados').value = ''; document.getElementById('novoLembrete').value = '30';

        setTimeout(() => { status.style.display = 'none'; }, 4000);
      } else {
        alert("Erro ao salvar: " + resultado.mensagem);
        status.style.display = 'none';
      }
    } catch (erro) {
      alert("Erro de conexão. Verifique se colou o link correto do script.");
      status.style.display = 'none';
    }
  }

  // --- AUTOCOMPLETE DE ENDEREÇO ---
  const inputLocal = document.getElementById('novoLocal');
  const boxSugestoes = document.getElementById('sugestoesLocal');
  let debounceTimer;

  inputLocal.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const termo = inputLocal.value.trim();
    if (termo.length < 3) { boxSugestoes.style.display = 'none'; boxSugestoes.innerHTML = ''; return; }
    debounceTimer = setTimeout(() => buscarEnderecos(termo), 350);
  });

  let numeroDigitadoAtual = '';

  function extrairNumeroDigitado(texto) {
    const match = texto.match(/(?:,|\s)+(s[nN]|S[nN]|\d+[a-zA-Z]?)\s*$/);
    return match ? match[1] : '';
  }

  async function buscarEnderecos(termo) {
    numeroDigitadoAtual = extrairNumeroDigitado(termo);
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=br&accept-language=pt-BR&addressdetails=1&q=${encodeURIComponent(termo + ', São Leopoldo, RS')}`;
      const resposta = await fetch(url);
      if (!resposta.ok) throw new Error('Falha na busca de endereço');
      const dados = await resposta.json();
      mostrarSugestoes(dados);
    } catch (erro) {
      console.error('Erro ao buscar endereços:', erro);
      boxSugestoes.style.display = 'none';
    }
  }

  function montarEnderecoLimpo(item) {
    const a = item.address || {};
    const partes = [];

    const rua = a.road || a.pedestrian || a.footway || '';
    const numero = a.house_number || numeroDigitadoAtual || '';
    if (rua) partes.push(numero ? `${rua}, ${numero}` : rua);

    const bairro = a.suburb || a.neighbourhood || a.quarter || '';
    if (bairro) partes.push(bairro);

    const cidade = a.city || a.town || a.village || a.municipality || '';
    if (cidade) partes.push(cidade);

    const estado = a.state || '';
    if (estado) partes.push(estado);
    partes.push('Brasil');

    if (partes.length <= 1) return (item.display_name || '').replace(/,?\s*\d{5}-?\d{3}\s*,/i, ',');
    return partes.join(', ');
  }

  function mostrarSugestoes(lista) {
    if (!lista || lista.length === 0) {
      boxSugestoes.style.display = 'none'; boxSugestoes.innerHTML = ''; return;
    }
    boxSugestoes.innerHTML = lista.map(item => {
      const enderecoFormatado = montarEnderecoLimpo(item);
      return `<div class="suggestion-item" data-endereco="${enderecoFormatado}">${enderecoFormatado}</div>`;
    }).join('');
    
    boxSugestoes.style.display = 'block';

    boxSugestoes.querySelectorAll('.suggestion-item').forEach((el) => {
      el.addEventListener('click', function() {
        inputLocal.value = this.getAttribute('data-endereco');
        boxSugestoes.style.display = 'none'; boxSugestoes.innerHTML = '';
      });
    });
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#novoLocal') && !e.target.closest('#sugestoesLocal')) {
      boxSugestoes.style.display = 'none';
    }
  });

  // --- FUNÇÃO PARA LER E FORMATAR A AGENDA (COM FORMATAÇÃO DO WHATSAPP) ---
  async function buscarAgenda() {
    const inputData = document.getElementById('dataBusca').value;
    if (!inputData) return alert('Por favor, selecione uma data!');

    const textArea = document.getElementById('resultadoAgenda');
    textArea.value = 'Buscando eventos... ⏳';

    const partesData = inputData.split('-');
    const dataObj = new Date(partesData[0], partesData[1] - 1, partesData[2]);
    const diasSemana = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
    const dia = String(dataObj.getDate()).padStart(2, '0');
    const mes = String(dataObj.getMonth() + 1).padStart(2, '0');

    // Cabeçalho formatado com * para Negrito no WhatsApp
    let textoFinal = `*AGENDA VEREADOR*\n*${dia}/${mes}  ${diasSemana[dataObj.getDay()]}*\n\n`;

    try {
      const urlCompleta = `${URL_DO_SCRIPT}?acao=ler&data=${inputData}`;
      const resposta = await fetch(urlCompleta);
      const eventos = await resposta.json();

      if (eventos.length === 0) {
        textoFinal += "Nenhum evento agendado para este dia.";
      } else {
        eventos.forEach(evento => {
          const local = evento.local ? ` — ${evento.local}` : '';
          
          // Trata a descrição: Limite de caracteres e formatação em itálico (_)
          let descFormatada = '';
          if (evento.descricao) {
            let desc = evento.descricao;
            const limiteCaract = 150; // Limite de caracteres para não poluir
            if (desc.length > limiteCaract) {
              desc = desc.substring(0, limiteCaract) + '...';
            }
            descFormatada = `\n   📝 _${desc}_`;
          }
          
          // Formatação com horário em negrito (*)
          textoFinal += `📍 *${evento.horario}:* ${evento.titulo}${local}${descFormatada}\n\n`;
        });
      }

      textArea.value = textoFinal.trim();

    } catch (erro) {
      textArea.value = "Erro ao buscar a agenda. Verifique o link do script.";
    }
  }

  // --- FUNÇÃO PARA COPIAR ---
  async function copiarTexto() {
    const textArea = document.getElementById('resultadoAgenda');
    let texto = textArea.value;
    
    if (!texto || texto === 'Buscando eventos... ⏳' || texto.trim() === '') {
      const dataBusca = document.getElementById('dataBusca').value;
      if (!dataBusca) return alert('Escolha uma data (ou clique em Hoje) primeiro!');
      
      textArea.value = 'Buscando eventos... ⏳'; 
      await buscarAgenda(); 
      texto = textArea.value; 
      if (!texto || texto.includes('Erro ao buscar')) return; 
    }

    function copiaComTextareaTemporario() {
      const temp = document.createElement('textarea');
      temp.value = texto; temp.style.position = 'fixed'; temp.style.top = '0'; temp.style.left = '0'; temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus(); temp.select(); temp.setSelectionRange(0, texto.length);
      let copiou = false;
      try { copiou = document.execCommand('copy'); } catch (e) { copiou = false; }
      document.body.removeChild(temp);

      if (copiou) alert('✅ Agenda copiada! Só colar no Zap.');
      else {
        textArea.focus(); textArea.select();
        alert('Não foi possível copiar automático. O texto está selecionado, use Ctrl+C.');
      }
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto)
        .then(() => alert('✅ Agenda copiada! Só colar no Zap.'))
        .catch(() => copiaComTextareaTemporario());
    } else { copiaComTextareaTemporario(); }
  }

  // --- FUNÇÃO PARA ENVIAR NO WHATSAPP ---
  async function enviarWhatsApp() {
    const textArea = document.getElementById('resultadoAgenda');
    let texto = textArea.value;
    
    if (!texto || texto === 'Buscando eventos... ⏳' || texto.trim() === '') {
      const dataBusca = document.getElementById('dataBusca').value;
      if (!dataBusca) return alert('Escolha uma data (ou clique em Hoje) primeiro!');
      
      textArea.value = 'Buscando eventos... ⏳';
      await buscarAgenda(); 
      texto = textArea.value; 
      if (!texto || texto.includes('Erro ao buscar')) return;
    }
    
    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
  }
